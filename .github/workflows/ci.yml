name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build (production)
        run: npx ng build --configuration production

  backend:
    name: Backend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm install

      - name: Run tests against a real Postgres
        run: npm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: petapp
          PGPASSWORD: petapp
          PGDATABASE: petapp
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petapp
          POSTGRES_PASSWORD: petapp
          POSTGRES_DB: petapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  docker-build:
    name: Docker images build (no push)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
