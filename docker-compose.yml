services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petapp
      POSTGRES_PASSWORD: petapp
      POSTGRES_DB: petapp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petapp -d petapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 8081
      PGHOST: db
      PGPORT: 5432
      PGUSER: petapp
      PGPASSWORD: petapp
      PGDATABASE: petapp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build: .
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
