apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petapp

resources:
  - namespace.yaml
  - postgres-secret.yaml
  - postgres-configmap.yaml
  - postgres-init-sql-configmap.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - backend-configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

# After CI/CD pushes new images, bump the tags here (or run the
# `kubectl set image` commands in k8s/README.md) and re-apply.
images:
  - name: ghcr.io/saracipevska/angularwebapplication-backend
    newTag: latest
  - name: ghcr.io/saracipevska/angularwebapplication-frontend
    newTag: latest
