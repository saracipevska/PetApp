# DEMO CREDENTIALS - fine for a local minikube/kind cluster only.
# For anything real: don't commit real secrets to git. Generate this instead with
#   kubectl -n petapp create secret generic postgres-secret --from-literal=POSTGRES_PASSWORD=<something-strong> --dry-run=client -o yaml
# or use a tool like Sealed Secrets / SOPS / external-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: petapp
type: Opaque
stringData:
  POSTGRES_PASSWORD: petapp
