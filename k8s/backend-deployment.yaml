apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: petapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Placeholder tag - the CI/CD pipeline (or `kubectl set image`) replaces
          # this with a real ghcr.io image built from backend/Dockerfile.
          image: ghcr.io/saracipevska/angularwebapplication-backend:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
