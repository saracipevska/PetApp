# Copy this to postgres-secret.yaml and set a real password before applying.
# postgres-secret.yaml is gitignored on purpose - never commit the real one.
#   cp postgres-secret.example.yaml postgres-secret.yaml
#   # then edit POSTGRES_PASSWORD below
# Or generate it directly instead of hand-editing a file:
#   kubectl -n petapp create secret generic postgres-secret --from-literal=POSTGRES_PASSWORD=<something-strong> --dry-run=client -o yaml > postgres-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: petapp
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
