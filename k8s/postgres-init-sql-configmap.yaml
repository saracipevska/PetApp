# Mirrors backend/src/db/init.sql. Mounted into Postgres' initdb.d so the
# schema is created automatically the first time the volume is empty.
# If you change backend/src/db/init.sql, update this file to match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: petapp
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS pets (
      id SERIAL PRIMARY KEY,
      name TEXT,
      type TEXT,
      breed TEXT,
      color TEXT,
      gender TEXT,
      age TEXT,
      location TEXT,
      date TEXT,
      description TEXT,
      contact TEXT,
      image TEXT,
      status TEXT NOT NULL DEFAULT 'adoption' CHECK (status IN ('adoption', 'lost', 'found')),
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_pets_status ON pets(status);

    CREATE TABLE IF NOT EXISTS adoption_requests (
      id SERIAL PRIMARY KEY,
      full_name TEXT,
      email TEXT,
      phone TEXT,
      pet_type TEXT,
      living TEXT,
      other_pets TEXT,
      reason TEXT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
