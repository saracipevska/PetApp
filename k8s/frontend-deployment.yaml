apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: petapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Placeholder tag - the CI/CD pipeline (or `kubectl set image`) replaces
          # this with a real ghcr.io image built from the root Dockerfile.
          image: ghcr.io/saracipevska/angularwebapplication-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
