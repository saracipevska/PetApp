server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service.
    # "backend" resolves via Docker Compose service name / Kubernetes Service name.
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Angular client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
